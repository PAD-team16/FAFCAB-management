
name: fafcab
x-with-wrapper: &with-wrapper
  volumes:
    - ./docker-entrypoint-scaled.sh:/scaling-wrapper.sh:ro
  entrypoint: ["/scaling-wrapper.sh"]   # wrapper becomes ENTRYPOINT


services:




  service-discovery:
    container_name: fafcab_service_discovery
    image: vmmmmv/service-discovery:latest
    restart: unless-stopped
    ports:
      - "8002:8001"
    volumes:
      - ./settings.yaml:/app/settings.yaml
    networks:
      - fafcab_network
    labels:
      logging: "promtail"

      
  gateway:
    container_name: fafcab_gateway
    image: vmmmmv/gateway:latest
    environment:
      PORT: 8000
      HOST: 0.0.0.0
    env_file:
      - .env
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./settings.yaml:/app/settings.yaml
      - ./cert.pem:/app/cert.pem:ro
      - ./key.pem:/app/key.pem:ro
    depends_on:
      - service-discovery
      - redis
      - postgres
      - communication-service
      - consumables-service
      - budgeting-service
      # - lostnfound-service
      - user-management-service
      - notification-service
      - fundraising-service
      - sharing-service
      - checkin-service
    networks:
      - fafcab_network

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - fafcab_network

  postgres:
    image: postgres:15
    container_name: fafcab_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fafcab_network
    command: >
      bash -c "
        echo 'CREATE DATABASE \"${POSTGRES_DB_1}\";' > /docker-entrypoint-initdb.d/01-create-dbs.sql &&
        echo 'CREATE DATABASE \"${POSTGRES_DB_2}\";' >> /docker-entrypoint-initdb.d/01-create-dbs.sql &&
        exec docker-entrypoint.sh postgres
      "
      

  communication-service:
    <<: *with-wrapper          
    image: huntrese/communication-service:latest
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_2}
      - PORT=8089
      - SERVICE_DISCOVERY_URL=http://fafcab_service_discovery:8001
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-fafcab}
    depends_on:
      - service-discovery
      - postgres
      - loki
    networks:
      - fafcab_network
    labels:
      logging: "promtail"


  consumables-service:
    image: huntrese/consumables-service:latest
    volumes:
      # Mount wrapper script to auto-detect container name
      - ./docker-entrypoint-scaled.sh:/scaling-wrapper.sh:ro
    entrypoint: ["/bin/sh", "/scaling-wrapper.sh"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_2}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - PORT=8080
      - PHX_SERVER=true
      - PHX_HOST=localhost
      - SERVICE_DISCOVERY_URL=http://fafcab_service_discovery:8001
    depends_on:
      - service-discovery
      - postgres
      - loki
    networks:
      - fafcab_network
    labels:
      logging: "promtail"


  budgeting-service:
    <<: *with-wrapper         
    image: vmmmmv/budget:latest
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - PHX_HOST=${PHX_HOST}
      - PHX_SERVER=${PHX_SERVER}
      - PORT=8080
      - SERVICE_PORT=8080
      - SERVICE_DISCOVERY_URL=http://fafcab_service_discovery:8001/api/services
    depends_on:
      - service-discovery
      - postgres
    networks:
      - fafcab_network
    labels:
      logging: "promtail"

# lostnfound-service:
#     image: vmmmmv/lostnfound:latest
#     container_name: fafcab_lostnfound_service
#     environment:
#       - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
#       - SECRET_KEY_BASE=${SECRET_KEY_BASE}
#       - PHX_HOST=${PHX_HOST}
#       - PHX_SERVER=${PHX_SERVER}
#       - PORT=8080
#       - SERVICE_NAME=lostnfound-service
#       - SERVICE_HOST=lostnfound-service
#       - SERVICE_PORT=8080
#       - SERVICE_DISCOVERY_URL=http://service_discovery:8001/api/services
#     depends_on:
#       - postgres
#     networks:
#       - fafcab_network
#     # logging:
#     #   driver: loki
#     #   options:
#     #     loki-url: "http://localhost:3100/loki/api/v1/push"



  lostnfound-service:
    <<: *with-wrapper         
    image: vmmmmv/lostnfound:latest
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - PHX_HOST=${PHX_HOST}
      - PHX_SERVER=${PHX_SERVER}
      - PORT=8080
      - SERVICE_PORT=8080
      - SERVICE_DISCOVERY_URL=http://fafcab_service_discovery:8001
      - SERVICE_NAME=lostnfound-service
    depends_on:
      - service-discovery
      - postgres
    networks:
      - fafcab_network
    labels:
      logging: "promtail"
      
  user-management-service:
    <<: *with-wrapper         
    image: yaeby/user-management-service:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SERVER_PORT=8080
      - DISCOVERY_URL=http://fafcab_service_discovery:8001
    env_file:
      - .env
    depends_on:
      - service-discovery
    networks:
      - fafcab_network
    labels:
      logging: "promtail"


  # NOTIFICATION SERVICE
  notification-service:
    <<: *with-wrapper         
    image: yaeby/notification-service:latest
    environment:
      - SERVER_PORT=8090
      - DISCOVERY_URL=http://fafcab_service_discovery:8001
    depends_on:
      - service-discovery
    env_file:
      - .env
    networks:
      - fafcab_network
    labels:
      logging: "promtail"
    deploy:
      mode: replicated
      replicas: 3  # Number of desired replicas

  fundraising-service:
    <<: *with-wrapper         
    image: pavel28/fundraising-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA=public
      - SERVER_PORT=8080
      - NOTIFICATION_URL=${NOTIFICATION_URL}
      - SERVICE_DISCOVERY_URL=http://fafcab_service_discovery:8001
    depends_on:
      - service-discovery
      - postgres
    networks:
      - fafcab_network
    labels:
      logging: "promtail"
    
  sharing-service:
    <<: *with-wrapper         
    image: pavel28/sharing-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA=public
      - SERVER_PORT=8080
      - DISCOVERY_URL=http://fafcab_service_discovery:8001
    depends_on:
      - service-discovery
      - postgres
    networks:
      - fafcab_network
    labels:
      logging: "promtail"

  cab-booking-service:
    image: vl4d09/cab-booking-service
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_1}
      - PORT=8080
      - SERVICE_DISCOVERY_URL=http://fafcab_service_discovery:8001
      - SERVICE_HOST=cab-booking-service
    depends_on:
      - service-discovery
      - postgres
    networks:
      - fafcab_network
    labels:
      logging: "promtail"

  checkin-service:
    image: vl4d09/checkin-service
    environment:
      - DATABASE_URL=postgresql://checkin_user:checkin_pass@checkin-db:5432/checkin_service
      - PORT=8080
      - SERVICE_DISCOVERY_URL=http://fafcab_service_discovery:8001
      - SERVICE_HOST=checkin-service
    depends_on:
      service-discovery:
        condition: service_started
      checkin-db:
        condition: service_healthy
    networks:
      - fafcab_network
    labels:
      logging: "promtail"


  checkin-db:
    image: postgres:15-alpine
    platform: linux/amd64
    environment:
      POSTGRES_DB: checkin_service
      POSTGRES_USER: checkin_user
      POSTGRES_PASSWORD: checkin_pass
    volumes:
      - checkin_data:/var/lib/postgresql/data
      - ./checkin-init-scripts:/docker-entrypoint-initdb.d  

    networks:
      - fafcab_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkin_user -d checkin_service"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      logging: "promtail"

  message-broker:
    image: huntrese/message-broker:latest
    container_name: message_broker
    ports:
      - "8004:8000"
    depends_on:
      - message-broker-db
    environment:
      - DATABASE_URL=postgresql://postgres:password@message-broker-db:5432/message_broker
      - PYTHONUNBUFFERED=1
    networks:
      - fafcab_network
    command: ["gunicorn", "src.app:app", "--worker-class", "gthread", "--threads", "200", "--workers", "1", "--bind", "0.0.0.0:8000"]

  message-broker-db:
    image: postgres:13-alpine
    container_name: message_broker_db
    environment:
      POSTGRES_DB: message_broker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"  # Different port to avoid conflicts
    volumes:
      - message_broker_postgres_data:/var/lib/postgresql/data
    networks:
      - fafcab_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP port
      - "8025:8025"  # Web UI port
    logging:
      driver: "none"
    networks:
      - fafcab_network

  # Observability Stack for Service Logging
  loki:
    image: grafana/loki:3.0.0
    user: root
    ports:
      - "3100:3100"
    volumes:
      - ./loki-local-config.yaml:/etc/loki/loki-local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-local-config.yaml -log.level=warn
    networks:
      - fafcab_network

  promtail:
    image: grafana/promtail:3.0.0
    volumes:
      - ./promtail-config.yaml:/etc/promtail/promtail-config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail-config.yaml
    networks:
      - fafcab_network
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.4.0
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_LOG_LEVEL=warn
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - fafcab_network

  # Data Warehouse Database
  data-warehouse:
    image: postgres:15
    container_name: fafcab_data_warehouse
    environment:
      POSTGRES_USER: ${DW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DW_POSTGRES_PASSWORD}
      POSTGRES_DB: ${DW_POSTGRES_DB}
    volumes:
      - dw_data:/var/lib/postgresql/data
      - ./data-warehouse/dw-schema.sql:/docker-entrypoint-initdb.d/01-dw-schema.sql
    ports:
      - "5433:5432"
    networks:
      - fafcab_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DW_POSTGRES_USER} -d ${DW_POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ETL Pipeline Service
  etl-pipeline:
    build:
      context: ./data-warehouse
      dockerfile: Dockerfile
    container_name: fafcab_etl_pipeline
    environment:
      - DW_POSTGRES_HOST=data-warehouse
      - DW_POSTGRES_PORT=5432
      - DW_POSTGRES_DB=${DW_POSTGRES_DB}
      - DW_POSTGRES_USER=${DW_POSTGRES_USER}
      - DW_POSTGRES_PASSWORD=${DW_POSTGRES_PASSWORD}
      # Source database connections
      - SOURCE_MAIN_DB_HOST=postgres
      - SOURCE_MAIN_DB_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # Check-in service database connections
      - SOURCE_CHECKIN_DB_HOST=checkin-db
      - SOURCE_CHECKIN_DB_PORT=5432
      - SOURCE_CHECKIN_DB_NAME=checkin_service
      - SOURCE_CHECKIN_DB_USER=checkin_user
      - SOURCE_CHECKIN_DB_PASSWORD=checkin_pass
      # Additional database configurations
      - POSTGRES_DB_1=${POSTGRES_DB_1}
      - POSTGRES_DB_2=${POSTGRES_DB_2}
      # ETL configuration
      - SCHEDULER_INTERVAL_MINUTES=${SCHEDULER_INTERVAL_MINUTES}
    volumes:
      - ./data-warehouse/etl-logs:/app/logs
    depends_on:
      data-warehouse:
        condition: service_healthy
    networks:
      - fafcab_network

  # ETL Monitoring API
  etl-api:
    build:
      context: ./data-warehouse
      dockerfile: Dockerfile.api
    container_name: fafcab_etl_api
    environment:
      - DW_POSTGRES_HOST=data-warehouse
      - DW_POSTGRES_PORT=5432
      - DW_POSTGRES_DB=${DW_POSTGRES_DB}
      - DW_POSTGRES_USER=${DW_POSTGRES_USER}
      - DW_POSTGRES_PASSWORD=${DW_POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB_1=${POSTGRES_DB_1}
      - POSTGRES_DB_2=${POSTGRES_DB_2}
      - API_PORT=8000
    ports:
      - "8003:8000"
    volumes:
      - ./data-warehouse/etl-logs:/app/logs
    depends_on:
      data-warehouse:
        condition: service_healthy
    networks:
      - fafcab_network

volumes:
  postgres_data:
  redis_data:
  checkin_data: 
    driver: local
  loki_data:
  grafana_data:
  dw_data:
    driver: local
  message_broker_postgres_data:
    driver: local

networks:
  fafcab_network:
    driver: bridge
