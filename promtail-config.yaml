server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]
    

    relabel_configs:
      # --- Extract and define ONLY the labels we want ---

      # 1. Set 'job' from Compose service if available
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'container_service'

      # 2. Set 'job' as container name (without leading '/')
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'job'

      # 3. Add container_id (useful for debugging)
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'

      # 4. Add log stream (stdout/stderr)
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'

  

      # --- CRITICAL: DROP all Docker labels to prevent compose_project, service_name, etc. ---
      - action: labeldrop
        regex: '__meta_docker_container_label_.+'

      # --- Drop all other discovery metadata ---
      - action: labeldrop
        regex: '__meta.*'

    pipeline_stages:
      # Parse JSON logs
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            event: event
            request_id: request_id
            method: method
            path: path
            status: status
            duration_ms: duration_ms
            user_id: user_id
            error_type: error_type
            error_message: error_message
            context: context

      - labelallow:
          - level
          - event
          - container_service
          - job
          - container_id
          - stream

      # Use timestamp from log if available
      - timestamp:
          source: timestamp
          format: RFC3339
          fallback_formats:
            - RFC3339Nano

      # Promote only these JSON fields as labels
      - labels:
          level:
          event: